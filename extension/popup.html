<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    width:380px;margin:0;padding:16px 18px 18px;
    background:#0d1117;color:#e6edf3;
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Microsoft YaHei",sans-serif;
  }
  h1{font-size:15px;margin:0 0 3px;display:flex;align-items:center;gap:7px}
  h1 .dot{width:8px;height:8px;border-radius:50%;background:#4f8cff}
  .sub{color:#8b949e;font-size:11.5px;margin:0 0 14px}
  label{display:block;font-size:11.5px;color:#8b949e;margin:11px 0 4px}
  input{
    width:100%;padding:8px 10px;border-radius:7px;
    border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  input:focus{outline:none;border-color:#4f8cff}
  button{
    width:100%;margin-top:16px;padding:11px;border:0;border-radius:8px;
    background:linear-gradient(180deg,#4f8cff,#3d7bf0);color:#fff;
    font-size:13.5px;font-weight:600;cursor:pointer;
  }
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.55;cursor:default;filter:none}
  .steps{background:#161b22;border:1px solid #30363d;border-radius:8px;
    padding:10px 12px;margin-top:14px;font-size:11.5px;color:#8b949e;line-height:1.75}
  .steps b{color:#e6edf3}
  #log{margin-top:14px;font-size:12px;white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,Consolas,monospace;display:none}
  #log.show{display:block}
  .ok{color:#3fb950}.bad{color:#f85149}.warn{color:#d29922}
  .foot{margin-top:14px;padding-top:11px;border-top:1px solid #21262d;
    font-size:11px;color:#6e7681;line-height:1.7}
  code{background:#161b22;padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
  <h1><span class="dot"></span>Muse Studio Cookie </h1>
  <p class="sub"> muse.ai ， musestudio 。</p>

  <label>（BASE URL）</label>
  <input id="base" placeholder="http://your-server-ip:18610" spellcheck="false">

  <label>API Key</label>
  <input id="key" placeholder="mst_..." spellcheck="false">

  <label>Tai khoan（）</label>
  <input id="label" placeholder=" muse-main" spellcheck="false">

  <button id="go"></button>

  <div class="steps">
    <b>：</b><br>
    1. <b></b> <a href="https://muse.ai/" target="_blank"
       style="color:#4f8cff">muse.ai</a>（）。<br>
    2.  API Key （ musestudio 「Tai khoan」）。
  </div>

  <div id="log"></div>

  <div class="foot">
    ： <code>chrome.cookies</code>  muse.ai 
    Cookie（ httpOnly ），POST 。
    、。
  </div>

  <script src="popup.js"></script>
</body>
</html>
