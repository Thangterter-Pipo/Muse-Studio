# MUSE_STUDIO Nginx Muse Studio internal logic
# ==========================================
# Muse Studio internal logic / 1Panel / Muse Studio internal logic Nginx
# Muse Studio internal logic：Muse Studio internal logic proxy_read_timeout，Dong proxy_buffering Muse Studio internal logic SSE Muse Studio internal logic
# ==========================================

server {
    listen 80;
    server_name your-domain.com; #  IP

    # Muse Studio internal logic（Muse Studio internal logic / Muse Studio internal logic）
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Muse Studio internal logic：Muse Studio internal logic 30~120 Muse Studio internal logic，Muse Studio internal logic 60s Muse Studio internal logic Nginx Muse Studio internal logic 502 Bad Gateway
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Muse Studio internal logic：DongMuse Studio internal logic，Muse Studio internal logic /v1/chat/completions Muse Studio internal logic SSE Muse Studio internal logic 0 Muse Studio internal logic
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Muse Studio internal logic
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Muse Studio internal logic
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
